services:
  - type: worker
    name: ironclad-discord-bot
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci
    preDeployCommand: npm run deploy
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DATA_FILE
        value: /var/data/state.json
    disk:
      name: ironclad-data
      mountPath: /var/data
      sizeGB: 1
