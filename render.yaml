services:
  - type: web
    name: ironclad-discord-bot
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: DATA_FILE
        value: /var/data/state.json
    disk:
      name: ironclad-data
      mountPath: /var/data
      sizeGB: 1
